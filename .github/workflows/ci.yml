name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenbyte_test
          POSTGRES_USER: greenbyte
          POSTGRES_PASSWORD: greenbyte-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenbyte -d greenbyte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://greenbyte:greenbyte-test-password@localhost:5432/greenbyte_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
