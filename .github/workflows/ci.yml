name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envbyte_test
          POSTGRES_USER: envbyte
          POSTGRES_PASSWORD: envbyte-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envbyte -d envbyte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://envbyte:envbyte-test-password@localhost:5432/envbyte_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  # A secrets manager has no business shipping a dependency with a known
  # advisory, so this gates merges rather than merely reporting.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  # Builds the Windows installer on every change, so a mistake in packaging/msi
  # shows up here rather than halfway through a release.
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p envbyte
      - name: Build envbyte.msi
        shell: pwsh
        run: packaging/msi/build.ps1 -Version 0.0.0 -Binary target/debug/envbyte.exe -Out envbyte.msi

  # The same for the macOS installer. Both architectures, so the universal
  # binary step is exercised too.
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --locked -p envbyte --target x86_64-apple-darwin
          cargo build --locked -p envbyte --target aarch64-apple-darwin
      - name: Build envbyte.pkg
        run: |
          sh packaging/macos/build.sh 0.0.0 \
            target/x86_64-apple-darwin/debug/envbyte \
            target/aarch64-apple-darwin/debug/envbyte \
            envbyte.pkg
          pkgutil --expand-full envbyte.pkg expanded
          lipo "$(find expanded -path '*usr/local/bin/envbyte' -type f)" -verify_arch x86_64 arm64

  # Proves the minimum supported Rust version in Cargo.toml is still accurate.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  # The website Vercel deploys, and the install scripts it serves. People pipe
  # those scripts straight into a shell, so they are linted on every change.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: shellcheck -s sh public/install.sh ../packaging/macos/build.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/public/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
