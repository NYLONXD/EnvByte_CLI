name: Release

# Cutting a release is `git tag v0.3.0 && git push --tags`. Everything below
# runs from that tag, so the binaries people download are built from exactly
# the commit the tag points at.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuses to publish a tag whose tests do not pass, or whose tag does not
  # match the version in Cargo.toml.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envbyte_test
          POSTGRES_USER: envbyte
          POSTGRES_PASSWORD: envbyte-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envbyte -d envbyte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://envbyte:envbyte-test-password@localhost:5432/envbyte_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag must match the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="envbyte"))')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag v$tag does not match cli/Cargo.toml version $crate" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')
      - run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl gives a static binary that runs on Alpine and old glibc hosts.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p envbyte --target ${{ matrix.target }}

      # One archive per target, laid out so `cargo binstall` and the install
      # script can both find the binary at a predictable path.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          name="envbyte-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/envbyte" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          name="envbyte-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/envbyte.exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          (cd dist && 7z a "../$name.zip" "$name")
          sha256sum "$name.zip" > "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: envbyte-${{ matrix.target }}
          path: |
            envbyte-*.tar.gz
            envbyte-*.tar.gz.sha256
            envbyte-*.zip
            envbyte-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false

  # Runs last so a failed binary build never leaves an unusable version
  # published on crates.io, which cannot be deleted - only yanked.
  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived
    # crates.io token, so no long-lived registry secret is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # A version published by hand (the very first one has to be, before
      # Trusted Publishing can be configured) must not fail the release.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "envbyte-release (https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/envbyte/${GITHUB_REF_NAME#v}")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.exists != 'true'
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists != 'true'
        id: auth
      - run: cargo publish -p envbyte --locked
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The channels below each switch on with a repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables) once their
  # account and secret exist, so a release never fails on one that is not set
  # up yet. packaging/README.md walks through each.

  # PUBLISH_NPM=true, with secret NPM_TOKEN.
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance: links each package to this build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node packaging/npm/build.mjs "$GITHUB_REF_NAME" artifacts npm-out
      # Platform packages first, so the launcher's optionalDependencies
      # resolve the moment it appears.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            spec=$(node -p "const p = require('./$1/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
              return
            fi
            (cd "$1" && npm publish --access public --provenance)
          }
          for dir in npm-out/cli-*; do publish "$dir"; done
          publish npm-out/envbyte

  # PUBLISH_TAPS=true, with secret TAP_TOKEN able to push to both repos.
  taps:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TAPS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: python3 packaging/render.py "$GITHUB_REF_NAME" artifacts manifests
      - name: Push the Homebrew formula and the Scoop manifest
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "envbyte-release"
          git config --global user.email "envbyte-release@users.noreply.github.com"
          update() { # <owner/repo> <directory to copy in>
            checkout=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/$1.git" "$checkout"
            cp -R "$2"/. "$checkout"/
            git -C "$checkout" add -A
            if git -C "$checkout" diff --cached --quiet; then
              echo "$1 is already up to date"
              return
            fi
            git -C "$checkout" commit -m "envbyte ${GITHUB_REF_NAME#v}"
            git -C "$checkout" push origin HEAD:main
          }
          update NYLONXD/homebrew-tap manifests/homebrew
          update NYLONXD/scoop-bucket manifests/scoop

  # PUBLISH_WINGET=true, with secret WINGET_TOKEN, once the first version has
  # been accepted into microsoft/winget-pkgs by hand.
  winget:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Envbyte.Envbyte
          installers-regex: 'windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  container:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Image names must be lowercase, which the repository name is not.
          images: ghcr.io/nylonxd/envbyte-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
