name: Release

# Cutting a release is bumping the version in cli/Cargo.toml and pushing that
# to main. Every push to main checks whether its version has a GitHub release
# yet; when it does not, the commit is tested, built, tagged v<version> and
# published. There is no tag to push by hand, so a version cannot reach
# crates.io while the install scripts still have nothing to download.
#
# Running it by hand on another branch is a dry run: it tests and builds every
# target but publishes nothing.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time. A push that lands mid-release waits, then finds the
# version already released and stops.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="envbyte"))')"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          publish=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            case "$status" in
              200) echo "$tag is already released" ;;
              404) publish=true ;;
              *) echo "::error::GitHub answered $status when asked for release $tag" >&2; exit 1 ;;
            esac
          fi

          if [ "$publish" = true ]; then
            # A leftover tag pointing elsewhere would label binaries built from
            # this commit with another commit's source.
            tagged="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists at $tagged, not at $GITHUB_SHA. Bump the version in cli/Cargo.toml, or delete the tag." >&2
              exit 1
            fi
            echo "Releasing $tag from $GITHUB_SHA"
          fi

          build="$publish"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then build=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Refuses to publish a commit whose tests do not pass.
  verify:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envbyte_test
          POSTGRES_USER: envbyte
          POSTGRES_PASSWORD: envbyte-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envbyte -d envbyte_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://envbyte:envbyte-test-password@localhost:5432/envbyte_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl gives a static binary that runs on Alpine and old glibc hosts.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p envbyte --target ${{ matrix.target }}

      # envbyte-setup.exe, behind the website's Download button. It downloads
      # whichever release is latest, so it ships beside the archives rather
      # than inside one.
      - name: Build the Windows installer
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked -p envbyte-setup --target ${{ matrix.target }}

      # One archive per target, laid out so `cargo binstall` and the install
      # script can both find the binary at a predictable path.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          name="envbyte-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/envbyte" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          name="envbyte-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/envbyte.exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          (cd dist && 7z a "../$name.zip" "$name")
          sha256sum "$name.zip" > "$name.zip.sha256"
          cp "target/${{ matrix.target }}/release/envbyte-setup.exe" envbyte-setup.exe
          sha256sum envbyte-setup.exe > envbyte-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: envbyte-${{ matrix.target }}
          path: |
            envbyte-*.tar.gz
            envbyte-*.tar.gz.sha256
            envbyte-*.zip
            envbyte-*.zip.sha256
            envbyte-setup.exe
            envbyte-setup.exe.sha256
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          draft: false

  # Runs last so a failed binary build never leaves an unusable version
  # published on crates.io, which cannot be deleted - only yanked.
  crates-io:
    needs: [plan, release]
    runs-on: ubuntu-latest
    # Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived
    # crates.io token, so no long-lived registry secret is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # A version published by hand (the very first one has to be, before
      # Trusted Publishing can be configured) must not fail the release.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "envbyte-release (https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/envbyte/${{ needs.plan.outputs.version }}")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.exists != 'true'
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists != 'true'
        id: auth
      - run: cargo publish -p envbyte --locked
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The channels below each switch on with a repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables) once their
  # account and secret exist, so a release never fails on one that is not set
  # up yet. packaging/README.md walks through each.

  # PUBLISH_NPM=true, once every package has its Trusted Publisher set.
  npm:
    needs: [plan, release]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    # Trusted Publishing: npm accepts GitHub's OIDC token in place of an
    # access token, so there is no npm secret to store, leak or let expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # No registry-url: it writes a placeholder token into .npmrc, and the
      # login here is the OIDC exchange npm performs on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: node packaging/npm/build.mjs "${{ needs.plan.outputs.tag }}" artifacts npm-out
      # Platform packages first, so the launcher's optionalDependencies
      # resolve the moment it appears.
      - name: Publish to npm
        run: |
          set -euo pipefail
          publish() {
            spec=$(node -p "const p = require('./$1/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
              return
            fi
            (cd "$1" && npm publish --access public --provenance)
          }
          for dir in npm-out/cli-*; do publish "$dir"; done
          publish npm-out/envbyte

  # PUBLISH_TAPS=true, with secret TAP_TOKEN able to push to both repos.
  taps:
    needs: [plan, release]
    if: vars.PUBLISH_TAPS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: python3 packaging/render.py "${{ needs.plan.outputs.tag }}" artifacts manifests
      - name: Push the Homebrew formula and the Scoop manifest
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "envbyte-release"
          git config --global user.email "envbyte-release@users.noreply.github.com"
          update() { # <owner/repo> <directory to copy in>
            checkout=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/$1.git" "$checkout"
            cp -R "$2"/. "$checkout"/
            git -C "$checkout" add -A
            if git -C "$checkout" diff --cached --quiet; then
              echo "$1 is already up to date"
              return
            fi
            git -C "$checkout" commit -m "envbyte ${{ needs.plan.outputs.version }}"
            git -C "$checkout" push origin HEAD:main
          }
          update NYLONXD/homebrew-tap manifests/homebrew
          update NYLONXD/scoop-bucket manifests/scoop

  # PUBLISH_WINGET=true, with secret WINGET_TOKEN, once the first version has
  # been accepted into microsoft/winget-pkgs by hand.
  winget:
    needs: [plan, release]
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Envbyte.Envbyte
          release-tag: ${{ needs.plan.outputs.tag }}
          installers-regex: 'windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  container:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Image names must be lowercase, which the repository name is not.
          images: ghcr.io/nylonxd/envbyte-server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
