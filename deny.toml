# Dependency policy, enforced in CI by `cargo deny check`.
#
# Greenbyte handles other people's production credentials, so a known-vulnerable
# or unmaintained dependency is a release blocker rather than a note.

[advisories]
yanked = "deny"
# Add an entry here only with a dated comment explaining why the advisory does
# not apply, so an exception cannot quietly become permanent.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive only. A copyleft dependency would change what downstream users of
# the CLI are allowed to do with it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
