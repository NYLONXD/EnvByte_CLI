<p><strong>Envbyte is installed.</strong> Open Terminal and run:</p>
<pre><code>envbyte register</code></pre>
<p>Then, in your project's folder, <code>envbyte create &lt;name&gt;</code> and <code>envbyte push</code>.</p>
<p>To uninstall: <code>sudo rm /usr/local/bin/envbyte &amp;&amp; sudo pkgutil --forget in.trackedge.envbyte</code></p>
</body>
