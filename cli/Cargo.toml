[package]
name = "envbyte"
version = "0.4.0"
edition = "2021"
description = "Share .env files across a team with end-to-end encryption and rotatable keys"
authors = ["Envbyte"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/NYLONXD/EnvByte_CLI"
homepage = "https://envbyte.trackedge.in"
documentation = "https://docs.rs/envbyte"
readme = "README.md"
rust-version = "1.88"
keywords = ["dotenv", "secrets", "env", "encryption", "cli"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

# Lets `cargo binstall envbyte` find the release archives without downloading
# and unpacking the crate first.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "envbyte"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# HTTP client for server communication
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization / deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encryption (AES-256-GCM)
aes-gcm = "0.10"

# Key derivation for reading legacy passphrase-encrypted snapshots
argon2 = "0.5"

# X25519 identity keys: the project data key is sealed to each member's public
# key, so it never has to be shared out of band
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Derives the wrapping key from an X25519 shared secret
hkdf = "0.12"

# Random number generation
rand = "0.8"

# Base64 encoding/decoding
base64 = "0.22"

# SHA hashing
sha2 = "0.10"

# Get MAC address of the machine
mac_address = "1.1"

# Colored terminal output
colored = "2.1"

# Spinner / progress indicator
indicatif = "0.18"

# Home directory resolution
dirs = "5.0"

# Date/time for logs
chrono = { version = "0.4", features = ["serde"] }

# UUID for commit addresses
uuid = { version = "1.8", features = ["v4"] }

# Secure password input (hides typing)
rpassword = "7.3"

# Hex encoding/decoding
hex = "0.4"

# Clear sensitive key material from memory when it is no longer needed
zeroize = "1.8"
