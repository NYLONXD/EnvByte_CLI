services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: envbyte
      POSTGRES_USER: envbyte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envbyte-local-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - envbyte-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envbyte -d envbyte"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ENVBYTE_ENV: development
      ENVBYTE_BIND: 0.0.0.0:3030
      DATABASE_URL: postgres://envbyte:${POSTGRES_PASSWORD:-envbyte-local-change-me}@postgres:5432/envbyte
      ENVBYTE_JWT_SECRET: ${ENVBYTE_JWT_SECRET:-local-development-secret-change-before-production}
      ENVBYTE_EMAIL_MODE: ${ENVBYTE_EMAIL_MODE:-log}
      RUST_LOG: ${RUST_LOG:-envbyte_server=info,tower_http=info}
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3030/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  envbyte-postgres:
