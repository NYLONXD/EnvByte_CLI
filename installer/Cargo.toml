[package]
name = "envbyte-setup"
# Versioned on its own: it installs whichever Envbyte release is latest, so it
# does not need a rebuild, or a bump, for each CLI release.
version = "0.1.0"
edition = "2021"
description = "Windows installer for the Envbyte CLI"
authors = ["Envbyte"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/NYLONXD/EnvByte_CLI"
homepage = "https://envbyte.trackedge.in"
rust-version = "1.88"
publish = false

[[bin]]
name = "envbyte-setup"
path = "src/main.rs"

# Everything is Windows-only. On other platforms the binary just points at
# install.sh, so the workspace still builds and tests on Linux CI.
[target.'cfg(windows)'.dependencies]
colored = "2.1"
dirs = "5.0"
hex = "0.4"
indicatif = "0.18"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
# Reading the release .zip only needs inflate.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Only built when compiling on Windows, where the resource compiler lives.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
